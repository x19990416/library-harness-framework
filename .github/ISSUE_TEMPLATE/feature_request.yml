name: 功能提案
description: 提议可复用的领域能力或框架改进
title: "[Proposal]: "
labels: ["proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题与业务背景
      description: 说明要解决的问题，而不只是期望的实现。
    validations:
      required: true
  - type: textarea
    id: reuse
    attributes:
      label: 可复用性
      description: 说明至少哪些应用或场景可以共享该能力。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述接口、数据流、边界与替代方案。
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 风险与限制
      description: 包括隐私、安全、兼容性和运维影响。

